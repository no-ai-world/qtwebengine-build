# ============================================================================
# 把自建的 QtWebEngine 运行时打进官方 PySide6 轮子，发一套可以直接 pip 安装的轮子。
#
# 这条流水线**不编译任何东西**，也不碰 build-qtwebengine：
#   * 运行时从**已经发布**的 Release 里取（标签 qtwebengine-<版本>-win64-msvc2022-codecs），
#     所以重发一套轮子只要几分钟，而不是几小时；
#   * 官方轮子从 PyPI 取，取哪几个发行版是**推出来的**（PySide6==<版本> 的 requires_dist），
#     不是写死的四个；
#   * 注入见 scripts/pyside6/inject-webengine-runtime.py。
#
# 发哪几个文件：一条规则，不是一次判断
#   某个轮子必须发 ⟺ 我们的运行时**实际改动**了它的内容（逐字节比对）。
#   其余轮子与 PyPI 上的原件逐字节相同，re-host 只是搬运，所以不上架——它们在
#   MANIFEST.json 里被钉住（版本 + sha256），用户从 PyPI 取同一份即可。
#   实测 PySide6 6.8.3：运行时 64 个文件里只有 6 个真的变了，且都在 PySide6_Addons，
#   所以发布集合是 {Addons}。哪天 `resources/icudtl.dat`（在 PySide6_Essentials 里）变了，
#   集合就自动变成 {Addons, Essentials}——**不需要改这里的任何一行**。
#   scripts/pyside6/stage-publish-set.py 从注入脚本的账本里读这个集合，Release 说明
#   （含安装命令、改动了哪些文件）也从同一份数据生成，不是手写文案。
#
# 本地版本段（local_version，默认 codecs）
#   被改动过的轮子挂上 `+codecs`（6.8.3 → 6.8.3+codecs）。这样它在**任何**解析器眼里都比
#   PyPI 上的同名同版本轮子大：索引与本地目录同时存在时也会确定地选我们的。实测过那个坑——
#   `pip install "pyside6==6.8.3" --find-links <目录>` 在没有本地段时会静默装成官方包
#   （连 --no-cache-dir 都一样，3/3 次），挂上本地段之后就选我们的了。
#   PEP 440：说明符不带本地段时匹配会忽略候选的本地段，所以 `pyside6==6.8.3` 声明的
#   `pyside6-addons==6.8.3` 依然被满足（pip check 通过）。
#
# 发布的门禁（打包正确性，不是编解码器有效性）
#   1. 运行时 zip 与本仓库 Release 里随包的 .sha256 一致；
#   2. 注入后每个轮子的 RECORD 与实际内容逐条对得上（脚本自己重新打开产物核对），
#      挂了本地版本段的还要核"文件名 / dist-info / METADATA 三者版本一致"；
#   3. 四个轮子在一次性 venv 里离线装得上（--no-index --find-links），运行时里的
#      每个文件在 site-packages 里逐字节落位。**注意自测用的是完整的一套**（含从 PyPI
#      取来的那些），发布的只是其中变化过的那几个——门禁不因为少发而降级。
#
# 运行环境要求：windows-2022 级别的 runner、约 3 GB 磁盘；Python 必须 <3.14。
# ============================================================================

name: build-pyside6-wheels

on:
  workflow_dispatch:
    inputs:
      pyside_version:
        description: 'PySide6 / Qt 版本（同时决定默认取哪个 QtWebEngine Release）'
        type: string
        default: '6.8.3'
      webengine_tag:
        description: '已有的 QtWebEngine Release 标签（留空 = qtwebengine-<版本>-win64-msvc2022-codecs）'
        type: string
        default: ''
      local_version:
        description: '挂在被改动过的轮子上的本地版本段（6.8.3 → 6.8.3+codecs）。留空则不挂；挂着它，索引里同时有官方包时解析器也会确定地选我们的'
        type: string
        default: 'codecs'
      new_file_owner:
        description: '运行时里有、上游轮子里都没有的新文件归哪个发行版（留空 = 遇到就失败）。上游加了新文件时才需要填'
        type: string
        default: ''
      python_version:
        description: '打包与自测用的 Python（PySide6 6.8.3 要求 <3.14）'
        type: string
        default: '3.12'
      runner:
        description: 'runs-on 标签（不需要大规格 runner：这条流水线不编译）'
        type: string
        default: 'windows-2022'
      timeout_minutes:
        description: '作业超时（分钟）'
        type: number
        default: 60
      create_release:
        description: '打包成功后发布 GitHub Release（默认开；传 false 可只出 artifact）'
        type: boolean
        default: true
      release_tag:
        description: 'Release 标签（留空 = pyside6-<版本>-win64-msvc2022-codecs）'
        type: string
        default: ''

permissions:
  contents: write

# 同版本串行：两条作业同时往同一个 tag 上写会互相覆盖资产
concurrency:
  group: build-pyside6-wheels-${{ inputs.pyside_version }}
  cancel-in-progress: false

env:
  PYSIDE_VERSION: ${{ inputs.pyside_version }}
  WEBENGINE_TAG: ${{ inputs.webengine_tag != '' && inputs.webengine_tag || format('qtwebengine-{0}-win64-msvc2022-codecs', inputs.pyside_version) }}
  RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || format('pyside6-{0}-win64-msvc2022-codecs', inputs.pyside_version) }}
  RUNTIME_DIR: dist/runtime
  UPSTREAM_DIR: dist/upstream
  WHEELS_DIR: dist/wheels
  PUBLISH_DIR: dist/publish
  UPSTREAM_MANIFEST: dist/upstream-manifest.json
  INJECT_MANIFEST: dist/inject-manifest.json

jobs:
  wheels:
    name: PySide6 ${{ inputs.pyside_version }} · Windows x64 · wheels with proprietary codecs
    runs-on: ${{ inputs.runner }}
    # fromJSON 不能省：workflow_dispatch 的 number 输入经 API 派发时到达 inputs 上下文的是
    # 字符串，而 timeout-minutes 要的是数字。
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    steps:
      - name: 取本仓库（打包脚本）
        uses: actions/checkout@v4

      - name: 装 Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: 取已有的 QtWebEngine Release（不重新编译）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:RUNTIME_DIR | Out-Null
          gh release download $env:WEBENGINE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern '*' --clobber --dir $env:RUNTIME_DIR
          # gh 是外部命令，退出码不会自己变成异常：Release 不存在时它只打印一行，作业会
          # 继续往下跑到注入那一步才失败（那时报的是"运行时不存在"，离根因很远）。
          if ($LASTEXITCODE -ne 0) {
            throw "取不到 Release $env:WEBENGINE_TAG：先派一轮 build-qtwebengine（或用 -f webengine_tag= 指定别的标签）"
          }
          Get-ChildItem -LiteralPath $env:RUNTIME_DIR | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: 核对运行时 zip 与随包 .sha256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNTIME_DIR "qtwebengine-$env:PYSIDE_VERSION-win64-msvc2022-codecs.zip"
          $sidecar = "$zip.sha256"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Release 里没有 $zip" }
          if (-not (Test-Path -LiteralPath $sidecar)) { throw "Release 里没有 $sidecar（没有它就无法核对下载）" }
          # 随包格式是 `sha256sum` 的样子：<hash>  <文件名>
          $record = (Get-Content -LiteralPath $sidecar -Raw).Trim() -split '\s+'
          $expect = $record[0].ToLower()
          if ($record.Count -gt 1 -and $record[1] -ne (Split-Path $zip -Leaf)) {
            throw "随包 .sha256 指的是 $($record[1])，而下载下来的是 $(Split-Path $zip -Leaf)"
          }
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          if ($expect -ne $actual) { throw "运行时 zip 的 sha256 与随包记录不一致：期望 $expect，实得 $actual" }
          $mb = (Get-Item -LiteralPath $zip).Length / 1MB
          Write-Host ("运行时 zip  {0:N1} MB  sha256={1}" -f $mb, $actual)

      - name: 取官方 PySide6 轮子（PyPI，带摘要核对）
        shell: pwsh
        run: |
          python -u -X utf8 scripts/pyside6/fetch-pyside6-wheels.py `
            -Version $env:PYSIDE_VERSION -Destination $env:UPSTREAM_DIR -Manifest $env:UPSTREAM_MANIFEST
          if ($LASTEXITCODE -ne 0) { throw '取官方轮子失败' }

      - name: 注入运行时（重算 RECORD 并逐个自证）
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNTIME_DIR "qtwebengine-$env:PYSIDE_VERSION-win64-msvc2022-codecs.zip"
          python -u -X utf8 scripts/pyside6/inject-webengine-runtime.py `
            -Runtime $zip -Wheels $env:UPSTREAM_DIR -Destination $env:WHEELS_DIR `
            -ExpectVersion $env:PYSIDE_VERSION `
            -LocalVersion '${{ inputs.local_version }}' `
            -NewFileOwner '${{ inputs.new_file_owner }}' `
            -Manifest $env:INJECT_MANIFEST
          if ($LASTEXITCODE -ne 0) { throw '注入失败' }

      - name: 按账本挑出必须发的轮子并生成 Release 说明
        shell: pwsh
        run: |
          # 发哪几个文件由"运行时实际改动了谁"决定，而不是这里的 glob——写死的那一刻就与规则脱钩了
          python -u -X utf8 scripts/pyside6/stage-publish-set.py `
            -Stage $env:WHEELS_DIR -Inject $env:INJECT_MANIFEST -Upstream $env:UPSTREAM_MANIFEST `
            -Destination $env:PUBLISH_DIR `
            -ReleaseUrlBase "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/" `
            -WebEngineTag $env:WEBENGINE_TAG
          if ($LASTEXITCODE -ne 0) { throw '挑发布集合失败' }

      - name: 离线安装自测（一次性 venv，装完逐字节核对）
        id: wheelcheck
        shell: pwsh
        run: |
          # 自测用的是**完整的一套**（变化的 + 从 PyPI 取来的），不是只发出去的那几个：
          # 少发不等于可以不验，而"四个能不能一起装上"正是用户那里的第一步。
          $zip = Join-Path $env:RUNTIME_DIR "qtwebengine-$env:PYSIDE_VERSION-win64-msvc2022-codecs.zip"
          python -u -X utf8 scripts/pyside6/verify-wheels.py `
            -Runtime $zip -Wheels $env:WHEELS_DIR -Version $env:PYSIDE_VERSION
          if ($LASTEXITCODE -ne 0) { throw '离线安装自测失败：这一套轮子不能算"装得上且装得对"' }

      - name: 汇总到作业页
        if: always()
        shell: pwsh
        run: |
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('## PySide6 ' + $env:PYSIDE_VERSION + ' · Windows x64 · 含私有编解码器的轮子')
          $lines.Add('')
          $lines.Add('| 项 | 值 |')
          $lines.Add('| --- | --- |')
          $lines.Add('| 运行时来源 | ' + $env:WEBENGINE_TAG + ' |')
          $lines.Add('| 官方轮子 | PyPI（按 requires_dist 推闭包，下载时核对 sha256） |')
          $manifest = Join-Path $env:PUBLISH_DIR 'MANIFEST.json'
          if (Test-Path -LiteralPath $manifest) {
            $data = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
            foreach ($w in $data.published) {
              $lines.Add(('| 发布 {0} | {1} · 改动 {2} 项 · `{3}` |' -f $w.name, $w.version, ($w.replaced + $w.added), $w.sha256))
            }
            foreach ($w in $data.unchanged_from_upstream) {
              $lines.Add(('| 未上架（与上游逐字节相同） | {0} {1} |' -f $w.name, $w.version))
            }
          } else {
            $lines.Add('| 产物 | 未生成 |')
          }
          $lines -join [Environment]::NewLine >> $env:GITHUB_STEP_SUMMARY

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyside6-${{ inputs.pyside_version }}-win64-msvc2022-codecs-wheels
          path: |
            dist/wheels/*.whl
            dist/publish/*
            dist/*-manifest.json
          if-no-files-found: warn
          retention-days: 30

      - name: 发布 Release
        # 显式引用自测步的结论：这一步的意义就是"装不上就不发"，不能只靠 success() 的隐含顺序
        if: ${{ success() && steps.wheelcheck.outcome == 'success' && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ format('PySide6 {0} · Windows x64 · MSVC 2022 · H.264/AAC', inputs.pyside_version) }}
          # 正文是**生成**的：文件名、改动项、安装命令都来自实际产物，不是手写文案
          body_path: dist/publish/RELEASE_NOTES.md
          files: dist/publish/*
          fail_on_unmatched_files: true
          # 同一版本重打一次就更新同一个 tag：第二次发布时 tag 已存在，
          # overwrite_files 保证同名资产被替换而不是报 already_exists 判红。
          overwrite_files: true
